# geoserver-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geoserver
  namespace: ns-sigemad
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geoserver
  template:
    metadata:
      labels:
        app: geoserver
    spec:
      containers:
      - name: geoserver
        image: docker.osgeo.org/geoserver:2.26.2
        ports:
          - containerPort: 8080
        env:
          # Opcional: si quieres credenciales distintas al default
          - name: GEOSERVER_ADMIN_USER
            value: "admin"
          - name: GEOSERVER_ADMIN_PASSWORD
            value: "sigemad"
        volumeMounts:
          - name: geoserver-data
            mountPath: /opt/geoserver_data
      volumes:
        - name: geoserver-data
          persistentVolumeClaim:
            claimName: pvc-geoserver
